
name: Keep Upstash Redis active

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check showcase
        run: |
          curl --fail --silent --show-error --location \
            --max-time 45 \
            "https://conflict-as-a-bug.vercel.app/showcase?heartbeat=$(date +%s)" \
            -o /tmp/showcase.html
          grep -q 'Open cases' /tmp/showcase.html
