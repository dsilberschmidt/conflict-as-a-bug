[package]
name = "tee_hybrid_crypto"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib"]

[dependencies]
aes-gcm = "0.10.3"
base64 = "0.22.1"
cre_wasm_exports = { path = "../node_modules/@chainlink/cre-sdk-javy-plugin/src/cre_wasm_exports" }
javy-plugin-api = "6.0.0"
rsa = { version = "0.9.8", features = ["pem"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
